<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Menu - Dapur Ulul</title>
<style>
:root { font-family: Arial, Helvetica, sans-serif; color: #333; background: #faf7f2; }
* { box-sizing: border-box; }
body { margin: 0; }
main { width: min(1100px, 100%); margin: auto; padding: 28px 15px 60px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; }
h1 { color: #8b4513; margin: 0; font-size: 28px; }
a, button { cursor: pointer; }
a { color: #8b4513; font-weight: 700; text-decoration: none; }
.panel { background: white; border: 1px solid #eadfd5; border-radius: 12px; padding: 18px; margin-bottom: 18px; box-shadow: 0 3px 12px rgba(0,0,0,.05); }
.panel h2 { margin: 0 0 14px; color: #8b4513; font-size: 19px; }
.fields { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.full { grid-column: 1 / -1; }
label { font-size: 12px; font-weight: 700; color: #555; }
input, select { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font: inherit; }
input:focus, select:focus { outline: 2px solid rgba(139,69,19,.2); border-color: #8b4513; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
button { border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 700; }
.primary { background: #8b4513; color: white; }
.secondary { background: #f2eee9; color: #555; }
.danger { background: #e53935; color: white; }
.status { min-height: 20px; color: #666; font-size: 14px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 680px; }
th, td { border-bottom: 1px solid #eee; padding: 10px 8px; text-align: left; vertical-align: top; }
th { color: #8b4513; font-size: 13px; }
td { font-size: 14px; }
.row-actions { display: flex; gap: 6px; }
@media (max-width: 600px) { .fields { grid-template-columns: 1fr; } .field.full { grid-column: auto; } header { align-items: flex-start; flex-direction: column; } }
</style>
</head>
<body>
<main>
<header>
    <h1>Admin Menu Dapur Ulul</h1>
    <a href="index.html">Kembali ke menu</a>
</header>

<section class="panel">
    <h2>Pengaturan Google Sheets</h2>
    <div class="fields">
        <div class="field full">
            <label for="apiUrl">URL Web App Google Apps Script</label>
            <input id="apiUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec">
        </div>
        <div class="field">
            <label for="apiToken">Token admin</label>
            <input id="apiToken" type="password" placeholder="Sesuai token di Apps Script">
        </div>
    </div>
    <div class="actions">
        <button class="primary" id="loadButton" type="button">Muat dari Sheets</button>
        <button class="secondary" id="saveSettingsButton" type="button">Simpan Pengaturan</button>
    </div>
    <p class="status" id="status" role="status"></p>
</section>

<section class="panel">
    <h2 id="formTitle">Tambah Menu</h2>
    <form id="menuForm">
        <input id="menuId" type="hidden">
        <div class="fields">
            <div class="field"><label for="name">Nama menu</label><input id="name" required maxlength="60"></div>
            <div class="field"><label for="price">Harga (Rp)</label><input id="price" type="number" min="1" required></div>
            <div class="field"><label for="category">Kategori</label><select id="category"><option value="makanan">Makanan</option><option value="seafood">Seafood</option><option value="snack">Snack</option><option value="minuman">Minuman</option></select></div>
            <div class="field"><label for="badge">Label (opsional)</label><input id="badge" maxlength="20"></div>
            <div class="field full"><label for="description">Deskripsi</label><input id="description" required maxlength="120"></div>
            <div class="field full"><label for="image">URL gambar (opsional)</label><input id="image" type="text"></div>
        </div>
        <div class="actions"><button class="primary" type="submit">Simpan Menu</button><button class="secondary" id="resetButton" type="button">Batal / Bersihkan</button></div>
    </form>
</section>

<section class="panel">
    <h2>Daftar Menu</h2>
    <div class="table-wrap"><table><thead><tr><th>Nama</th><th>Kategori</th><th>Harga</th><th>Deskripsi</th><th>Aksi</th></tr></thead><tbody id="menuRows"></tbody></table></div>
</section>
</main>
<script>
const settingsKey = 'dapurUlulSheetsSettings';
const localMenusKey = 'dapurUlulMenus';
let menus = [];

const $ = id => document.getElementById(id);
const formatRupiah = value => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(value);

function settings() { return { url: $('apiUrl').value.trim().replace(/\/$/, ''), token: $('apiToken').value.trim() }; }
function showStatus(message, isError = false) { $('status').textContent = message; $('status').style.color = isError ? '#c62828' : '#666'; }
function readSettings() { const data = JSON.parse(localStorage.getItem(settingsKey) || '{}'); $('apiUrl').value = data.url || ''; $('apiToken').value = data.token || ''; }
function writeSettings() { localStorage.setItem(settingsKey, JSON.stringify(settings())); showStatus('Pengaturan tersimpan di browser ini.'); }
function resetForm() { $('menuForm').reset(); $('menuId').value = ''; $('formTitle').textContent = 'Tambah Menu'; }

function renderRows() {
    $('menuRows').innerHTML = '';
    menus.forEach(menu => {
        const row = document.createElement('tr');
        [menu.name, menu.category, formatRupiah(menu.price), menu.description].forEach(value => { const cell = document.createElement('td'); cell.textContent = value; row.appendChild(cell); });
        const actions = document.createElement('td'); actions.className = 'row-actions';
        const edit = document.createElement('button'); edit.className = 'secondary'; edit.textContent = 'Edit'; edit.onclick = () => editMenu(menu);
        const remove = document.createElement('button'); remove.className = 'danger'; remove.textContent = 'Hapus'; remove.onclick = () => deleteMenu(menu.id);
        actions.append(edit, remove); row.appendChild(actions); $('menuRows').appendChild(row);
    });
}

function formMenu() { return { id: $('menuId').value || crypto.randomUUID(), name: $('name').value.trim(), price: Number($('price').value), category: $('category').value, badge: $('badge').value.trim(), description: $('description').value.trim(), image: $('image').value.trim() }; }
function editMenu(menu) { Object.entries(menu).forEach(([key, value]) => { if ($(key)) $(key).value = value; }); $('formTitle').textContent = 'Edit Menu'; window.scrollTo({ top: 0, behavior: 'smooth' }); }

async function request(action, menu) {
    const config = settings();
    if (!config.url) throw new Error('Isi URL Web App Google Apps Script terlebih dahulu.');
    if (!/\/exec(?:\?.*)?$/.test(config.url)) throw new Error('Gunakan URL deployment yang berakhiran /exec, bukan /dev.');

    try {
        const response = await fetch(config.url, { method: 'POST', mode: 'cors', cache: 'no-store', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: config.token, menu }) });
        const text = await response.text();
        let result;
        try { result = JSON.parse(text); } catch { throw new Error('Respons Apps Script bukan JSON. Pastikan deployment berakses Anyone.'); }
        if (!response.ok || result.error) throw new Error(result.error || `HTTP ${response.status}`);
        return result;
    } catch (error) {
        if (error instanceof TypeError) throw new Error('Failed to fetch. Pastikan URL /exec benar, deployment Apps Script berakses Anyone, dan buka halaman melalui HTTPS GitHub Pages.');
        throw error;
    }
}

async function loadMenus() {
    const config = settings();
    if (!config.url) { menus = JSON.parse(localStorage.getItem(localMenusKey) || '[]'); renderRows(); showStatus('Mode lokal aktif. Isi URL Apps Script untuk memakai Google Sheets.'); return; }
    if (!/\/exec(?:\?.*)?$/.test(config.url)) { showStatus('Gunakan URL deployment yang berakhiran /exec, bukan /dev.', true); return; }
    try {
        const response = await fetch(config.url, { mode: 'cors', cache: 'no-store' });
        const text = await response.text();
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        try { menus = JSON.parse(text); } catch { throw new Error('Respons Apps Script bukan JSON.'); }
        if (!Array.isArray(menus)) throw new Error('Format data dari Google Sheets tidak valid.');
        renderRows(); showStatus(`${menus.length} menu dimuat dari Google Sheets.`);
    } catch (error) {
        showStatus(error instanceof TypeError ? 'Failed to fetch. Deployment Apps Script mengarah ke login Google. Edit deployment menjadi Anyone, lalu deploy versi baru.' : error.message, true);
    }
}

$('menuForm').onsubmit = async event => {
    event.preventDefault(); const menu = formMenu(); const action = $('menuId').value ? 'update' : 'create';
    try { if (settings().url) { await request(action, menu); await loadMenus(); } else { const index = menus.findIndex(item => item.id === menu.id); if (index >= 0) menus[index] = menu; else menus.push(menu); localStorage.setItem(localMenusKey, JSON.stringify(menus)); renderRows(); showStatus('Menu tersimpan di browser ini.'); } resetForm(); } catch (error) { showStatus(error.message, true); }
};
$('loadButton').onclick = loadMenus;
$('saveSettingsButton').onclick = writeSettings;
$('resetButton').onclick = resetForm;

async function deleteMenu(id) { if (!confirm('Hapus menu ini?')) return; try { if (settings().url) { await request('delete', { id }); await loadMenus(); } else { menus = menus.filter(menu => menu.id !== id); localStorage.setItem(localMenusKey, JSON.stringify(menus)); renderRows(); showStatus('Menu dihapus.'); } } catch (error) { showStatus(error.message, true); } }
readSettings(); loadMenus();
</script>
</body>
</html>
